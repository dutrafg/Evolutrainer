name: Refatoração - QA estrutural
on:
  push:
    branches:
      - refactor/arquitetura-2026-10
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar estrutura e sintaxe
        run: node tests/structural-smoke.cjs
