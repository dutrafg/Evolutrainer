name: Android CI

on:
  push:
    branches: [feature/android-nativo-base]
  pull_request:

concurrency:
  group: evolupersonal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 36
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests and debug build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EvoluPersonal-0.3.0-dev-debug
          path: app/build/outputs/apk/debug/app-debug.apk


      - name: Upload test reports and Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EvoluPersonal-phase1-validation
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/schemas/
