name: Android CI

on:
  push:
    branches: [feature/android-nativo-base]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 36
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate bundled MD500 catalog
        run: |
          python3 - <<'PY'
          import json
          p='app/src/main/assets/md500-catalog.json'
          d=json.load(open(p, encoding='utf-8'))
          ids=[x['externalId'] for x in d['exercises']]
          assert d['exerciseCount']==500 and len(ids)==500 and len(set(ids))==500
          assert sum(bool(x['animationPath']) for x in d['exercises'])==420
          print("500 IDs canônicos; 420 referências de mídia, não necessariamente aprovadas")
          PY
      - name: Unit tests and debug build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EvoluPersonal-0.1.0-dev-debug
          path: app/build/outputs/apk/debug/app-debug.apk
