name: Híbrido beta — QA da aplicação
on:
  push:
    branches: [feature/pwa-hibrido-beta]
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test && npm run build
      - name: Pacote Android com mídias privadas
        run: echo 'O APK completo é compilado em dutrafg/EvoluPersonal, branch integration/evolupersonal-beta4-media, workflow export-app-beta4.yml, com a revisão do aplicativo fixada.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EvoluPersonal-beta-QA
          path: docs/
